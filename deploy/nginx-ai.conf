# Add inside the existing "server { listen 443 ssl; ... }" block of the ELOG site, next to
# "location /manage/". The trailing slashes strip the /ai prefix.

    location /ai/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host              $host;
        # must be the same expression as in the location that proxies elogd: elogd binds each
        # session to this address, and ELOG AI passes it on when it checks the session
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;                 # answers are streamed as they are written
        proxy_read_timeout 600s;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }
